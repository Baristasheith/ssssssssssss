format_version: "20"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

workflows:
  primary:
    steps:
      - git-clone@8: {}
      - flutter-installer@1:
          inputs:
            - version: "3.47.6"
      - script@1:
          title: Test, analyze, and build Android APK
          inputs:
            - content: |-
                set -euo pipefail
                flutter --version
                dart --version
                flutter pub get
                flutter analyze
                flutter test
                chmod +x android/gradlew
                flutter build apk --release
                mkdir -p "$BITRISE_DEPLOY_DIR"
                cp build/app/outputs/flutter-apk/app-release.apk "$BITRISE_DEPLOY_DIR/price-label-scanner.apk"
      - deploy-to-bitrise-io@2: {}
